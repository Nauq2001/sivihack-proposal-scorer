[project]
name = "rfp-analyst"
version = "0.1.0"
description = "RFP extraction and criterion resolution for the Proposal Scorer"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.10,<3",
  "langchain-google-genai>=4.0,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-cov>=6,<7"]

[project.scripts]
rfp-analyst = "rfp_analyst.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rfp_analyst"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

